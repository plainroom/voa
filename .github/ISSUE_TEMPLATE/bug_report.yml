name: Bug
description: Something voa did that you did not expect
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, passwords, or email content. Describe the problem without quoting the mail.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: The version in About This Mac. For example, macOS 26.1.
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: voa
    attributes:
      label: voa version
      description: The version in the name of the disk image you opened, such as 0.4.21. The app has no About screen.
      placeholder: "0.4.21"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, what you expected, and what happened.
    validations:
      required: true
